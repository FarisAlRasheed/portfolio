<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محرّر الموقع</title>
  <link rel="stylesheet" href="/editor.css">
</head>
<body>
  <header class="bar">
    <h1>محرّر الموقع</h1>
    <nav id="tabs"></nav>
    <span id="status" role="status"></span>
    <button id="save" class="primary" disabled>حفظ</button>
  </header>
  <div class="layout">
    <main id="form"></main>
    <aside>
      <div class="preview-head">
        <strong>المعاينة</strong>
        <button id="reload">إعادة تحميل</button>
      </div>
      <iframe id="preview" src="http://localhost:5173" title="معاينة الموقع"></iframe>
      <p class="hint">المعاينة تتحدّث بعد الحفظ. بعد أن ترضى عن التعديلات، ارفعها بـ git كعادتك.</p>
    </aside>
  </div>
  <script src="/editor.js"></script>
</body>
</html>
